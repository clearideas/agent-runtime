version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      development:
        dependency-type: development
      runtime-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /examples/agent-runner
    schedule:
      interval: weekly
    groups:
      development:
        dependency-type: development
      runtime-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /examples/showcase
    schedule:
      interval: weekly
    groups:
      development:
        dependency-type: development
      runtime-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
