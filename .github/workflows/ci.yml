name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate on Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24
          - 26

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate workspace
        run: npm run validate

      - name: Test packed consumer installation
        run: npm run check:consumer

      - name: Build documentation site
        run: npm run docs:build

      - name: Audit production and development dependencies
        run: npm run audit:dependencies

      - name: Confirm clean generated state
        shell: bash
        run: |
          git diff --exit-code
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            git status --short
            echo "Validation left untracked files in the checkout." >&2
            exit 1
          fi

  agent-runner:
    name: Standalone Agent Runner consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm ci
        working-directory: examples/agent-runner
      - run: npm audit --audit-level=moderate
        working-directory: examples/agent-runner
      - run: npm test
        working-directory: examples/agent-runner

  anthropic-compatibility:
    name: Anthropic ${{ matrix.anthropic }} compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        anthropic: [4.0.71, 4.0.72, 4.0.84, 4.0.97]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the compatibility-matrix provider
        run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund @ai-sdk/anthropic@${{ matrix.anthropic }}
      - run: npm run build
      - name: Test the real provider with offline Anthropic responses
        run: node --test examples/patterns/anthropic-compatibility.test.mjs
        env:
          EXPECTED_ANTHROPIC_VERSION: ${{ matrix.anthropic }}

  ai-sdk-compatibility:
    name: AI SDK ${{ matrix.ai }} tool/schema and media compatibility
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ai: [7.0.98, 7.0.146, 7.0.163]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install the selected AI SDK without changing the lockfile
        run: npm install --no-save --package-lock=false ai@${{ matrix.ai }}
      - run: npm run build
      - name: Require the selected SDK version
        run: node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; assert.equal(JSON.parse(fs.readFileSync("node_modules/ai/package.json", "utf8")).version, process.env.EXPECTED_AI_VERSION);'
        env:
          EXPECTED_AI_VERSION: ${{ matrix.ai }}
      - run: npm test --workspace @clearideas/agent-runtime-model-ai-sdk

  sandbox-linux:
    name: Linux workspace and sandbox execution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          cache: npm
      - name: Install sandbox test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap python3
          # Enable user namespaces on this disposable runner for isolation tests.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run build
      - name: Require a working sandbox before running execution tests
        run: |
          node --input-type=module -e 'import { BubblewrapSandboxProvider } from "./packages/sandbox/dist/index.js"; await new BubblewrapSandboxProvider().probe();'
      - run: npm test --workspace @clearideas/agent-runtime-sandbox
      - run: npm test --workspace @clearideas/agent-runtime

  showcase:
    name: Showcase example (${{ matrix.sandbox }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sandbox:
          - bubblewrap
          - unisolated
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Install the sandbox
        if: matrix.sandbox == 'bubblewrap'
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap python3
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
        working-directory: examples/showcase
      - run: npm audit --audit-level=moderate
        working-directory: examples/showcase
      - name: Require the selected sandbox
        working-directory: examples/showcase
        run: >-
          node --input-type=module -e 'import assert from "node:assert/strict"; import { detectEnvironment } from "./lib/environment.ts"; const environment = await detectEnvironment({ host: "127.0.0.1", preference: process.env.SHOWCASE_SANDBOX }); assert.equal(environment.sandbox.kind, process.env.SHOWCASE_SANDBOX);'
        env:
          SHOWCASE_SANDBOX: ${{ matrix.sandbox }}
      - run: npm test
        working-directory: examples/showcase
        env:
          SHOWCASE_SANDBOX: ${{ matrix.sandbox }}

  showcase-windows:
    name: Showcase host on Windows
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - run: npm ci
        working-directory: examples/showcase
      - run: npm audit --audit-level=moderate
        working-directory: examples/showcase
      - name: Test the HTTP host, orchestration and browser state
        run: npm test
        working-directory: examples/showcase
        env:
          SHOWCASE_SANDBOX: none
