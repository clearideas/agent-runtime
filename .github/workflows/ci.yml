name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate on Node.js ${{ matrix.node }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node:
          - 24
          - 26

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate workspace
        run: npm run validate

      - name: Test packed consumer installation
        run: npm run check:consumer

      - name: Build documentation site
        run: npm run docs:build

      - name: Audit production and development dependencies
        run: npm run audit:dependencies

      - name: Confirm clean generated state
        shell: bash
        run: |
          git diff --exit-code
          if [[ -n "$(git status --porcelain --untracked-files=all)" ]]; then
            git status --short
            echo "Validation left untracked files in the checkout." >&2
            exit 1
          fi

  agent-runner:
    name: Standalone Agent Runner consumer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: npm install
        working-directory: examples/agent-runner
      - run: npm test
        working-directory: examples/agent-runner

  sandbox-linux:
    name: Linux workspace and sandbox execution
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: npm
      - name: Install sandbox test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes bubblewrap python3
          # Enable user namespaces on this disposable runner for isolation tests.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - run: npm ci
      - run: npm run build
      - name: Require a working sandbox before running execution tests
        run: |
          node --input-type=module -e 'import { BubblewrapSandboxProvider } from "./packages/sandbox/dist/index.js"; await new BubblewrapSandboxProvider().probe();'
      - run: npm test --workspace @clearideas/agent-runtime-sandbox
      - run: npm test --workspace @clearideas/agent-runtime
