name: Release packages

# A dispatch with release_enabled=false verifies the private registry and
# release candidate without publishing. Publishing additionally requires:
# 1. a manual dispatch with release_enabled=true;
# 2. repository variable NPM_RELEASES_ENABLED=true;
# 3. approval of the npm-production GitHub environment;
# 4. npm trusted-publisher configuration for this exact workflow; and
# 5. a read-only NPM_READ_TOKEN environment secret for private-package metadata
#    requests.
# Packages are scoped as @clearideas/* and publish only to the npm registry
# configured below and in publishConfig. Documentation deploys to GitHub Pages
# only when Changesets confirms that package publishing occurred.
on:
  workflow_dispatch:
    inputs:
      release_enabled:
        description: Confirm that the reviewed npm release controls are enabled
        required: true
        type: boolean
        default: false
      deploy_documentation:
        description: Build and deploy the documentation site
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  readiness:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-production
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the pinned npm release client
        run: npm install --global npm@12.0.1

      - name: Install locked dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      - name: Verify private npm registry access
        run: npm view @clearideas/agent-runtime@alpha version --json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      - name: Validate release candidate
        run: npm run validate

      - name: Build documentation site
        run: npm run docs:build

  release:
    if: ${{ github.ref == 'refs/heads/main' && inputs.release_enabled && vars.NPM_RELEASES_ENABLED == 'true' }}
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-production
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the pinned npm release client
        run: npm install --global npm@12.0.1

      - name: Install locked dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      - name: Validate release candidate
        run: npm run validate

      - name: Create version pull request or publish approved packages
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: npm run release:packages:alpha
          version: npm run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"

  documentation:
    name: Build documentation for GitHub Pages
    if: ${{ always() && !cancelled() && (needs.release.outputs.published == 'true' || inputs.deploy_documentation) }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read

    steps:
      - name: Check out published source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - name: Build documentation site
        run: npm run docs:build
        env:
          DOCS_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: docs/.vitepress/dist

  documentation-deploy:
    name: Deploy documentation to GitHub Pages
    if: ${{ always() && needs.documentation.result == 'success' }}
    needs: documentation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
