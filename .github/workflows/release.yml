name: Release packages

# A dispatch with release_enabled=false validates packages without publishing.
# Publishing additionally requires:
# 1. a manual dispatch with release_enabled=true;
# 2. repository variable NPM_RELEASES_ENABLED=true;
# 3. approval of the npm-production GitHub environment;
# 4. npm trusted-publisher configuration for this exact workflow.
# The Python distribution publishes to PyPI through a trusted publisher for
# this workflow and the pypi-production environment. TypeScript packages are
# scoped as @clearideas/* and publish only to npm. Documentation deploys to S3 and
# CloudFront when requested or when Changesets confirms that packages published.
on:
  workflow_dispatch:
    inputs:
      release_enabled:
        description: Publish approved npm and PyPI package versions
        required: true
        type: boolean
        default: false
      deploy_documentation:
        description: Build and deploy the documentation site
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: package-release
  cancel-in-progress: false

jobs:
  readiness:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-production
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the pinned npm release client
        run: npm install --global npm@12.0.1

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release candidate
        run: npm run validate

      - name: Test packed consumer installation
        run: npm run check:consumer

      - name: Build documentation site
        run: npm run docs:build

  release:
    if: ${{ github.ref == 'refs/heads/main' && inputs.release_enabled && vars.NPM_RELEASES_ENABLED == 'true' }}
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-production
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the pinned npm release client
        run: npm install --global npm@12.0.1

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release candidate
        run: npm run validate

      - name: Create version pull request or publish approved packages
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: npm run release:packages
          version-script: npm run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: true
          push-git-tags: true
        env:
          NPM_CONFIG_PROVENANCE: "true"

  build-python:
    name: Build Python distribution
    if: ${{ github.ref == 'refs/heads/main' && inputs.release_enabled }}
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Check shared release version
        run: |
          python - <<'PY'
          import json
          import tomllib
          from pathlib import Path

          npm_version = json.loads(Path('packages/core/package.json').read_text())['version']
          python_version = tomllib.loads(Path('python/pyproject.toml').read_text())['project']['version']
          if npm_version != python_version:
              raise SystemExit(f'Package versions differ: npm={npm_version}, PyPI={python_version}')
          print(f'Building clearideas-agent-runtime {python_version}')
          PY

      - name: Install distribution tools
        run: python -m pip install 'build==1.3.0' 'twine==7.0.0'

      - name: Build and validate distribution
        run: |
          python -m build python --outdir dist/python
          python -m twine check --strict dist/python/*
          python - <<'PY'
          import tarfile
          import tomllib
          import zipfile
          from pathlib import Path

          version = tomllib.loads(Path('python/pyproject.toml').read_text())['project']['version']
          artifacts = list(Path('dist/python').iterdir())
          if len(artifacts) != 2 or not any(p.suffix == '.whl' for p in artifacts) or not any(p.name.endswith('.tar.gz') for p in artifacts):
              raise SystemExit(f'Expected one wheel and one sdist, found: {artifacts}')
          wheel = next(p for p in artifacts if p.suffix == '.whl')
          sdist = next(p for p in artifacts if p.name.endswith('.tar.gz'))
          with zipfile.ZipFile(wheel) as archive:
              names = archive.namelist()
              if not any(name.endswith('/METADATA') and f'clearideas_agent_runtime-{version}' in name for name in names):
                  raise SystemExit('Wheel metadata has the wrong version')
              if 'clearideas_agent_runtime/__init__.py' not in names:
                  raise SystemExit('Wheel is missing the runtime package')
              if not any(name.endswith('/LICENSE') for name in names) or not any(name.endswith('/NOTICE') for name in names):
                  raise SystemExit('Wheel is missing LICENSE or NOTICE')
          with tarfile.open(sdist, 'r:gz') as archive:
              names = archive.getnames()
              if not any(name.endswith('/LICENSE') for name in names) or not any(name.endswith('/NOTICE') for name in names):
                  raise SystemExit('Source distribution is missing LICENSE or NOTICE')
          PY

      - name: Test installed wheel and CLI
        run: |
          python -m venv /tmp/agent-runtime-release-smoke
          /tmp/agent-runtime-release-smoke/bin/python -m pip install dist/python/*.whl
          /tmp/agent-runtime-release-smoke/bin/python - <<'PY'
          import importlib.metadata
          import json
          from pathlib import Path
          import clearideas_agent_runtime

          expected = json.loads(Path('packages/core/package.json').read_text())['version']
          actual = importlib.metadata.version('clearideas-agent-runtime')
          if actual != expected:
              raise SystemExit(f'Installed wheel has version {actual}, expected {expected}')
          PY
          /tmp/agent-runtime-release-smoke/bin/agent-runtime-py --help

      - name: Upload Python distribution
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: python-distribution
          path: dist/python/*
          if-no-files-found: error
          retention-days: 7

  publish-python:
    name: Publish Python distribution to PyPI
    if: ${{ github.ref == 'refs/heads/main' && inputs.release_enabled }}
    needs: build-python
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: pypi-production
    permissions:
      id-token: write

    steps:
      - name: Download verified distribution
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distribution
          path: dist/

      - name: Publish to PyPI using trusted publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          skip-existing: true

  documentation:
    name: Build and deploy documentation
    if: ${{ always() && !cancelled() && (needs.release.outputs.published == 'true' || inputs.deploy_documentation) }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment:
      name: documentation
      url: https://agent-runtime.clearideas.com

    steps:
      - name: Check out published source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Build documentation site
        run: npm run docs:build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: agent-runtime-documentation
          aws-region: us-east-1

      - name: Upload documentation
        run: >-
          aws s3 sync docs/.vitepress/dist s3://${{ vars.DOCS_S3_BUCKET }}
          --delete
          --cache-control "no-cache,no-store,must-revalidate"

      - name: Apply immutable cache headers to assets
        run: >-
          aws s3 cp docs/.vitepress/dist s3://${{ vars.DOCS_S3_BUCKET }}
          --recursive
          --exclude "*.html"
          --cache-control "public,max-age=31536000,immutable"

      - name: Invalidate CloudFront
        run: >-
          aws cloudfront create-invalidation
          --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          --paths "/*"
