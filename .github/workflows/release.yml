name: Release packages

# A dispatch with release_enabled=false verifies the private registry and
# release candidate without publishing. Publishing additionally requires:
# 1. a manual dispatch with release_enabled=true;
# 2. repository variable NPM_RELEASES_ENABLED=true;
# 3. approval of the npm-production GitHub environment;
# 4. npm trusted-publisher configuration for this exact workflow; and
# 5. a read-only NPM_READ_TOKEN secret for private-package metadata requests.
# Packages are scoped as @clearideas/*, remain private during the alpha, and
# publish only to the npm registry configured below and in publishConfig.
on:
  workflow_dispatch:
    inputs:
      release_enabled:
        description: Confirm that the reviewed npm release controls are enabled
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-production
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the pinned npm release client
        run: npm install --global npm@12.0.1

      - name: Install locked dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      - name: Verify private npm registry access
        run: npm view @clearideas/agent-runtime@alpha version --json
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      - name: Validate release candidate
        run: npm run validate

  release:
    if: ${{ inputs.release_enabled && vars.NPM_RELEASES_ENABLED == 'true' }}
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-production
    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the pinned npm release client
        run: npm install --global npm@12.0.1

      - name: Install locked dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN }}

      - name: Validate release candidate
        run: npm run validate

      - name: Create version pull request or publish approved packages
        uses: changesets/action@v1
        with:
          publish: npm run release:packages:alpha
          version: npm run version-packages
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_PROVENANCE: "false"
