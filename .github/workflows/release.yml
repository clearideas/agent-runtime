name: Release packages

# A dispatch with release_enabled=false validates packages without publishing.
# Publishing additionally requires:
# 1. a manual dispatch with release_enabled=true;
# 2. repository variable NPM_RELEASES_ENABLED=true;
# 3. approval of the npm-production GitHub environment;
# 4. npm trusted-publisher configuration for this exact workflow.
# Packages are scoped as @clearideas/* and publish only to the npm registry
# configured below and in publishConfig. Documentation deploys to S3 and
# CloudFront when requested or when Changesets confirms that packages published.
on:
  workflow_dispatch:
    inputs:
      release_enabled:
        description: Confirm that the reviewed npm release controls are enabled
        required: true
        type: boolean
        default: false
      deploy_documentation:
        description: Build and deploy the documentation site
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  readiness:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-production
    permissions:
      contents: read

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the pinned npm release client
        run: npm install --global npm@12.0.1

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release candidate
        run: npm run validate

      - name: Test packed consumer installation
        run: npm run check:consumer

      - name: Build documentation site
        run: npm run docs:build

  release:
    if: ${{ github.ref == 'refs/heads/main' && inputs.release_enabled && vars.NPM_RELEASES_ENABLED == 'true' }}
    needs: readiness
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-production
    permissions:
      contents: write
      id-token: write
      pull-requests: write
    outputs:
      published: ${{ steps.changesets.outputs.published }}

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Node.js for npm trusted publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install the pinned npm release client
        run: npm install --global npm@12.0.1

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release candidate
        run: npm run validate

      - name: Create version pull request or publish approved packages
        id: changesets
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          publish-script: npm run release:packages
          version-script: npm run version-packages
          commit-message: "chore: version packages"
          pr-title: "chore: version packages"
          create-github-releases: true
          push-git-tags: true
        env:
          NPM_CONFIG_PROVENANCE: "true"

  documentation:
    name: Build and deploy documentation
    if: ${{ always() && !cancelled() && (needs.release.outputs.published == 'true' || inputs.deploy_documentation) }}
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    environment:
      name: documentation
      url: https://agent-runtime.clearideas.com

    steps:
      - name: Check out published source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install locked dependencies
        run: npm ci

      - name: Build documentation site
        run: npm run docs:build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: agent-runtime-documentation
          aws-region: us-east-1

      - name: Upload documentation
        run: >-
          aws s3 sync docs/.vitepress/dist s3://${{ vars.DOCS_S3_BUCKET }}
          --delete
          --cache-control "no-cache,no-store,must-revalidate"

      - name: Apply immutable cache headers to assets
        run: >-
          aws s3 cp docs/.vitepress/dist s3://${{ vars.DOCS_S3_BUCKET }}
          --recursive
          --exclude "*.html"
          --cache-control "public,max-age=31536000,immutable"

      - name: Invalidate CloudFront
        run: >-
          aws cloudfront create-invalidation
          --distribution-id ${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}
          --paths "/*"
